name: Regenerar Capa

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Regenerar capa
        run: node scripts/regenerate-cadeiras-cover.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix: regenera capa do artigo de cadeiras"

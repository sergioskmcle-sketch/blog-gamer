name: Regenerar Artigo

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug do artigo a regenerar (vazio = ultimo gerado automaticamente)"
        required: false
        type: string
      apply:
        description: "Gravar alteracoes no repositorio"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: content-generation
  cancel-in-progress: false

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Rodar testes do gerador
        run: npm test

      - name: Determinar slug alvo
        id: slug
        run: |
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            echo "slug=${{ github.event.inputs.slug }}" >> $GITHUB_OUTPUT
          else
            SLUG=$(node -e "const s=require('./state.json'); console.log(s.last_slug||'')")
            echo "slug=${SLUG}" >> $GITHUB_OUTPUT
          fi

      - name: Regenerar artigo
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then FLAGS="--apply"; fi
          node scripts/regenerar-artigos.mjs --slug "${{ steps.slug.outputs.slug }}" $FLAGS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
          AFFILIATE_MODE: ${{ vars.AFFILIATE_MODE }}
          MONITOR_API_URL: ${{ vars.MONITOR_API_URL }}
          MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}

      - name: Validar artigo regenerado (portao de qualidade)
        id: validacao
        run: |
          node scripts/validar-artigo.mjs "${{ steps.slug.outputs.slug }}"

      - name: Verificar alteracoes
        id: check
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit e push
        if: steps.check.outputs.changed == 'true' && github.event.inputs.apply == 'true' && success()
        run: |
          git config user.name "blog-bot"
          git config user.email "bot@blog-gamer.com"
          git add -A
          git commit -m "feat: regenera artigo com pipeline atual"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "${GITHUB_REF_NAME}"

      - name: Disparar deploy
        if: steps.check.outputs.changed == 'true' && github.event.inputs.apply == 'true' && success()
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}

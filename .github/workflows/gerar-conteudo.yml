name: Gerar Conteudo Automatico

on:
  schedule:
    - cron: "30 9 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorar cooldown e gerar agora"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: content-generation
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Rodar testes do gerador
        run: npm test

      - name: Gerar artigo
        run: node scripts/gerar-artigo.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
          FORCE_GENERATE: ${{ github.event.inputs.force == 'true' && 'true' || '' }}
          AFFILIATE_MODE: ${{ vars.AFFILIATE_MODE }}
          MONITOR_API_URL: ${{ vars.MONITOR_API_URL }}
          MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}

      - name: Detectar artigo gerado
        id: artigo
        run: |
          FILES=$(git status --porcelain | awk '{print $2}' | grep '^src/content/artigos/.*\.md$' || true)
          if [ -n "$FILES" ]; then
            SLUG=$(basename "$(echo "$FILES" | head -n1)" .md)
            echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          else
            echo "slug=" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar alteracoes
        id: check
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Validar artigo gerado (portao de qualidade)
        id: validacao
        if: steps.check.outputs.changed == 'true'
        run: |
          FILES=$(git status --porcelain | awk '{print $2}' | grep '^src/content/artigos/.*\.md$' || true)
          if [ -z "$FILES" ]; then
            echo "Nenhum artigo alterado para validar."
          else
            for f in $FILES; do
              SLUG=$(basename "$f" .md)
              node scripts/validar-artigo.mjs "$SLUG"
            done
          fi

      - name: Instalar fontes Geist (arte do Instagram)
        if: steps.artigo.outputs.slug != ''
        run: |
          mkdir -p ~/.fonts
          cp scripts/fonts/*.ttf ~/.fonts/
          fc-cache -f >/dev/null 2>&1 || true

      - name: Gerar arte do Instagram (feed + story)
        if: steps.artigo.outputs.slug != ''
        run: |
          node scripts/gerar-arte-instagram.mjs "${{ steps.artigo.outputs.slug }}" || echo "WARN: arte do Instagram falhou (publicacao pulada neste ciclo)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit e push
        if: steps.check.outputs.changed == 'true' && success()
        run: |
          git config user.name "blog-bot"
          git config user.email "bot@blog-gamer.com"
          git add -A
          git commit -m "feat: artigo gerado automaticamente"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "${GITHUB_REF_NAME}"

      - name: Publicar no Instagram (feed + story)
        if: steps.artigo.outputs.slug != '' && success()
        run: node scripts/publicar-instagram.mjs "${{ steps.artigo.outputs.slug }}"
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_LONG_TOKEN: ${{ secrets.IG_LONG_TOKEN }}
          IG_IG_ID: ${{ secrets.IG_IG_ID }}
          IG_PAGE_ID: ${{ secrets.IG_PAGE_ID }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Registrar estado de publicacao (dedup)
        if: steps.artigo.outputs.slug != '' && success()
        run: |
          if git status --porcelain -- scripts/.ig-posted.json | grep -q .; then
            git config user.name "blog-bot"
            git config user.email "bot@blog-gamer.com"
            git add scripts/.ig-posted.json
            git commit -m "feat: registra artigo publicado no Instagram" || true
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "${GITHUB_REF_NAME}" || true
          fi

      - name: Disparar deploy
        if: steps.check.outputs.changed == 'true' && success()
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fechar issue de pipeline quando o ciclo voltar a funcionar
        if: success()
        run: |
          gh issue list --state open --label "pipeline" --json number --jq '.[] | .number' | while read -r N; do
            gh issue close "$N" --reason completed || true
          done
        env:
          GH_TOKEN: ${{ github.token }}

      # V12 — Persistir o estado mesmo quando o ciclo falha.
      # Antes, state.json so era commitado no sucesso: o contador de falhas
      # nunca chegava ao repositorio e o painel mostrava "saudavel" com 6
      # execucoes seguidas quebradas.
      - name: Registrar estado de falha
        if: failure()
        run: |
          if git status --porcelain -- state.json | grep -q .; then
            git config user.name "blog-bot"
            git config user.email "bot@blog-gamer.com"
            git add state.json
            git commit -m "chore: registra falha do ciclo automatico" || true
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "${GITHUB_REF_NAME}" || true
          else
            echo "state.json sem alteracoes — nada a registrar."
          fi

      - name: Notificar falha (V12 — issue unica + canal externo)
        if: failure()
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          OPEN=$(gh issue list --state open --label "pipeline" --json number --jq 'length')
          if [ "$OPEN" = "0" ]; then
            # Sem "|| true": se a notificacao falhar, o log tem que gritar.
            # Foi exatamente isso que escondeu 6 falhas seguidas em set/2026.
            gh issue create \
              --title "⚠️ Pipeline diário falhou" \
              --body "O job de geração falhou em: ${RUN_URL}. Corrija e feche esta issue para o próximo ciclo voltar a notificar." \
              --label "pipeline"
          else
            echo "Issue de pipeline já aberta — pulando nova notificação."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # Canal externo: nao depende de o Marcio abrir o GitHub.
      # Se o secret DISCORD_WEBHOOK nao existir, o passo apenas avisa e segue.
      - name: Avisar no Discord
        if: failure()
        run: |
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK nao configurado — canal externo desativado."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg u "$RUN_URL" \
              '{content: ("⚠️ **Blog Gamer** — o ciclo automático de conteúdo falhou.\nNenhum artigo foi publicado neste ciclo.\n" + $u)}')"
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

name: Gerar Conteudo Automatico

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorar cooldown e gerar agora"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: content-generation
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Rodar testes do gerador
        run: npm test

      - name: Gerar artigo
        run: node scripts/gerar-artigo.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
          FORCE_GENERATE: ${{ github.event.inputs.force == 'true' && 'true' || '' }}
          AFFILIATE_MODE: ${{ vars.AFFILIATE_MODE }}
          MONITOR_API_URL: ${{ vars.MONITOR_API_URL }}
          MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}

      - name: Verificar alteracoes
        id: check
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Validar artigo gerado (portao de qualidade)
        id: validacao
        if: steps.check.outputs.changed == 'true'
        run: |
          FILES=$(git status --porcelain | awk '{print $2}' | grep '^src/content/artigos/.*\.md$' || true)
          if [ -z "$FILES" ]; then
            echo "Nenhum artigo alterado para validar."
          else
            for f in $FILES; do
              SLUG=$(basename "$f" .md)
              node scripts/validar-artigo.mjs "$SLUG"
            done
          fi

      - name: Commit e push
        if: steps.check.outputs.changed == 'true' && success()
        run: |
          git config user.name "blog-bot"
          git config user.email "bot@blog-gamer.com"
          git add -A
          git commit -m "feat: artigo gerado automaticamente"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "${GITHUB_REF_NAME}"

      - name: Disparar deploy
        if: steps.check.outputs.changed == 'true' && success()
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Notificar falha (V11 — issue unica aberta)
        if: failure()
        run: |
          OPEN=$(gh issue list --state open --label "pipeline" --json number --jq 'length')
          if [ "$OPEN" = "0" ]; then
            gh issue create \
              --title "⚠️ Pipeline diário falhou" \
              --body "O job de geração falhou em: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Corrija e feche esta issue para o próximo ciclo voltar a notificar." \
              --label "pipeline" || true
          else
            echo "Issue de pipeline já aberta — pulando nova notificação."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
